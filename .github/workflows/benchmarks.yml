name: Benchmarks

# Runs the pytest-benchmark suite on every tagged release (and on demand) and
# fails when any case's mean is more than 20 percent slower than the committed
# baseline under benchmarks/baseline/. The baseline is regenerated on each
# release (make bench-baseline) and committed with the release, so the
# comparison is always against the previous release, not an ageing number.
# Results of every run are kept as a workflow artifact for the history.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  benchmark:
    name: Compare against baseline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Run benchmarks against the committed baseline
        run: >
          uv run --no-sync pytest benchmarks/ -m perf --benchmark-only
          --benchmark-min-rounds=5 -p no:cacheprovider
          --benchmark-storage=file://benchmarks/baseline
          --benchmark-compare='*/0001_baseline'
          --benchmark-compare-fail=mean:20%
          --benchmark-json=benchmark-results.json

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.ref_name }}
          path: benchmark-results.json
