name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/

      - name: Unit tests
        run: uv run pytest tests/ -m "not security_regression" --tb=short -q

      - name: Security regression tests
        run: uv run pytest tests/ -m security_regression --tb=short -q

      - name: Validate spec test counts
        run: uv run python scripts/validate_spec_counts.py

