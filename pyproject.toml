[project]
name = "boti-data"
version = "1.0.6"
description = "Data infrastructure for the Boti ecosystem"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    {name = "Luis Valverde"}
]
maintainers = [
    {name = "Luis Valverde", email = "lvalverdeb@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "asyncmy>=0.2.11,<0.3.0",
    "boti>=1.0.2,<2.0.0",
    "boti-dask>=1.0.0,<2.0.0",
    "dask[dataframe,distributed]>=2026.3.0,<2027.0.0",
    "pandas>=3.0.2,<4.0.0",
    "polars>=1.29.0,<2.0.0",
    "pymysql>=1.1.2,<2.0.0",
    "sqlalchemy[asyncio]>=2.0.49,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/lvalverdeb/boti-data"
Repository = "https://github.com/lvalverdeb/boti-data"
Documentation = "https://github.com/lvalverdeb/boti-data#readme"
Issues = "https://github.com/lvalverdeb/boti-data/issues"

[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-benchmark>=5.1.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402", "F841"]
"src/**" = ["UP007", "E701"]
# __init__.py has a deliberate non-alphabetical import order to break a circular import cycle
"src/boti_data/__init__.py" = ["I001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "perf: performance benchmark (not run in default test suite)",
    "security_regression: focused regression coverage for security fixes and audit findings",
]
filterwarnings = [
    'ignore:Distributed SQL task payloads will carry the raw DSN credential.*worker_connection_env_var.*:UserWarning',
    'ignore:Closing managed Dask session with 1 live persisted collection\(s\).*Missing dependency\.:RuntimeWarning',
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
boti_data = ["py.typed"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boti_data*"]
