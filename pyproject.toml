[project]
name = "boti-data"
version = "1.0.0"
description = "Data infrastructure for the Boti ecosystem"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    {name = "Luis Valverde", email = "lvalverdeb@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "asyncmy>=0.2.11",
    "boti>=0.1.0,<2.0.0",
    "dask[dataframe,distributed]>=2026.3.0",
    "fsspec>=2026.3.0",
    "ipykernel>=7.2.0",
    "pandas>=3.0.2",
    "polars>=1.29.0",
    "pyarrow>=23.0.1",
    "pydantic>=2.12.5",
    "pymysql>=1.1.2",
    "s3fs>=2026.3.0",
    "sqlalchemy[asyncio]>=2.0.49",
]

[project.urls]
Homepage = "https://github.com/lvalverdeb/boti-data"
Repository = "https://github.com/lvalverdeb/boti-data"
Documentation = "https://github.com/lvalverdeb/boti-data#readme"
Issues = "https://github.com/lvalverdeb/boti-data/issues"

[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
markers = [
    "security_regression: focused regression coverage for security fixes and audit findings",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boti_data*"]
