[project]
name = "boti-data"
version = "1.3.2"
description = "Data infrastructure for the Boti ecosystem"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    {name = "Luis Valverde"}
]
maintainers = [
    {name = "Luis Valverde", email = "lvalverdeb@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "boti>=1.0.2,<2.0.0",
    "sqlalchemy[asyncio]>=2.0.49,<3.0.0",
]

# Neither driver is imported directly by boti_data's own code — SQLAlchemy
# lazily imports the DBAPI module named by the connection URL's scheme
# (e.g. "mysql+pymysql://", "postgresql+asyncpg://") when the engine/dialect
# is actually constructed. So these are purely "make sure pip installed the
# right package for the DSN you're using" extras, not code-level optionality.
[project.optional-dependencies]
mysql = [
    "asyncmy>=0.2.11,<0.3.0",
    "pymysql>=1.1.2,<2.0.0",
]
postgres = [
    "asyncpg>=0.30.0,<0.32.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
]
# Merely importable, not called directly: importing pgvector.sqlalchemy has the
# side effect of registering the 'vector' type name into SQLAlchemy's Postgres
# dialect (sqlalchemy.dialects.postgresql.base.ischema_names), which is what
# boti_data.db.sql_model_registry's reflection needs to recognize pgvector
# Vector columns instead of falling back to an unusable NullType.
pgvector = [
    "pgvector>=0.3.0,<0.6.0",
]
# The dataframe-shaped, bulk-oriented side of the package (DataGateway/
# DataHelper, ParquetPipeline, HybridDataset, the sink pipelines, etc.) — not
# needed by the lightweight SqlRepository/AsyncSqlRepository single-row API,
# which only needs the base "boti-data" install.
dataframes = [
    "boti-dask>=1.0.0,<2.0.0",
    "dask[dataframe,distributed]>=2026.3.0,<2027.0.0",
    "pandas>=3.0.2,<4.0.0",
    "polars>=1.29.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/lvalverdeb/boti-data"
Repository = "https://github.com/lvalverdeb/boti-data"
Documentation = "https://github.com/lvalverdeb/boti-data#readme"
Issues = "https://github.com/lvalverdeb/boti-data/issues"

[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    # boti-data itself no longer requires these (see [project.optional-dependencies]
    # mysql), but tests/security/test_regressions_engine.py and
    # tests/data/test_sql_manager_registry.py construct real mysql+pymysql/
    # mysql+asyncmy engines and expect them to succeed, not raise a
    # missing-driver error — so the dev/test environment still needs both.
    "asyncmy>=0.2.11,<0.3.0",
    "pymysql>=1.1.2,<2.0.0",
    # Real async-SQLite driver used only by tests/data/test_sql_repository.py
    # for genuine end-to-end AsyncSqlRepository round-trips — not a runtime
    # dependency of boti_data itself, and not part of [mysql]/[postgres]/
    # [dataframes] since SQLite isn't one of boti-data's supported backends.
    "aiosqlite>=0.21.0,<0.23.0",
    # boti-data itself no longer requires these (see [project.optional-dependencies]
    # dataframes), but the bulk of the test suite exercises DataGateway/
    # DataHelper/ParquetPipeline/HybridDataset and friends, which do — so the
    # dev/test environment still needs the full dataframe stack installed.
    "boti-dask>=1.0.0,<2.0.0",
    "dask[dataframe,distributed]>=2026.3.0,<2027.0.0",
    "pandas>=3.0.2,<4.0.0",
    "polars>=1.29.0,<2.0.0",
    # Not part of [project.optional-dependencies] pgvector's runtime need — it's
    # here so tests/data/test_sql_model_registry_pgvector.py can verify the
    # registration side effect actually happens when the package is installed.
    "pgvector>=0.3.0,<0.6.0",
    "mypy>=1.14.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-benchmark>=5.1.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402", "F841"]
"src/**" = ["UP007", "E701"]
# __init__.py has a deliberate non-alphabetical import order to break a circular import cycle
"src/boti_data/__init__.py" = ["I001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "perf: performance benchmark (not run in default test suite)",
    "security_regression: focused regression coverage for security fixes and audit findings",
]
filterwarnings = [
    'ignore:Distributed SQL task payloads will carry the raw DSN credential.*worker_connection_env_var.*:UserWarning',
    'ignore:Closing managed Dask session with 1 live persisted collection\(s\).*Missing dependency\.:RuntimeWarning',
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
boti_data = ["py.typed"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boti_data*"]
